name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    # ubuntu-latest 已是 Ubuntu 26.04，coreutils 默认换成了 Rust 写的 uutils，行为和 GNU 不完全一样
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # librsvg2-bin 和中文字体给 -i 转 PNG 用，测试会检查真的转出了 PNG
      - run: sudo apt-get update -qq && sudo apt-get install -y gawk mawk busybox librsvg2-bin fonts-wqy-microhei
      - run: bash -n exitray.sh
      - name: gawk
        run: TEST_AWK=gawk python3 tests/test_regression.py
      - name: mawk
        run: TEST_AWK=mawk python3 tests/test_regression.py
      - name: BusyBox awk
        run: TEST_AWK='busybox awk' python3 tests/test_regression.py
      - name: Docs images
        # 配图和 README、docs/guide.md 里的文本样例要跟脚本现在的输出一致；不一致就运行 docs/tools/build.py 重新生成
        run: TEST_AWK=gawk python3 docs/tools/build.py --check
  bash-4-2:
    # 没有 wait -n 的旧 bash，走轮询空位那条路
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bash 4.2
        # bash 4.2 是 K&R 写法，GCC 15 默认按 C23 编译，`void f()` 成了无参函数，编不过。
        # 按 gnu89 编；-fpermissive 把 GCC 14 起默认报错的旧写法降回警告。参数要放进 CC：
        # mkbuiltins 这些编译时先跑的小程序用 CC_FOR_BUILD 和 CFLAGS_FOR_BUILD，不读 CFLAGS
        run: |
          curl -fsSL https://ftp.gnu.org/gnu/bash/bash-4.2.tar.gz -o /tmp/bash.tgz
          tar -xzf /tmp/bash.tgz -C /tmp
          cd /tmp/bash-4.2
          CC='gcc -std=gnu89 -fcommon -fpermissive' CFLAGS='-O2' ./configure --without-bash-malloc >/dev/null
          make -j2 >/dev/null
      - run: TEST_BASH=/tmp/bash-4.2/bash python3 tests/test_regression.py
  alpine:
    # 不装 coreutils，cat、ps、timeout 这些用的都是 BusyBox 的
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - run: apk add --no-cache bash python3
      - uses: actions/checkout@v4
      - run: bash -n exitray.sh && python3 tests/test_regression.py
